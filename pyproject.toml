[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "villager-detector"
version = "0.1.0"
description = "Local OpenCV villager detector"
requires-python = ">=3.11"
dependencies = [
    "opencv-python==5.0.0.93",
    "mss==10.2.0",
    "dxcam==0.3.0",
    "pydantic==2.13.5",
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
